<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caça Vinil</title>
<meta name="description" content="Ofertas de discos de vinil encontradas pela varredura automática">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><circle cx='50' cy='50' r='16' fill='%23e0603a'/><circle cx='50' cy='50' r='3' fill='%23111'/></svg>">
<style>
  :root {
    --bg: #f6f4f0; --surface: #ffffff; --text: #1d1b19; --muted: #6b655e; --line: #e4dfd7;
    --accent: #c4471f; --accent-soft: #fbe9e2; --good: #1f7a4d; --good-soft: #e1f3e9; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413; --surface: #1f1d1b; --text: #eeeae4; --muted: #a39c93; --line: #34312d;
      --accent: #f07a52; --accent-soft: #3a231b; --good: #5fcf94; --good-soft: #17301f; --warn: #e2b04a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151413; --surface: #1f1d1b; --text: #eeeae4; --muted: #a39c93; --line: #34312d;
    --accent: #f07a52; --accent-soft: #3a231b; --good: #5fcf94; --good-soft: #17301f; --warn: #e2b04a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 4px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .abas { display: flex; gap: 4px; margin: 16px 0 12px; border-bottom: 1px solid var(--line); }
  .abas button { border: 0; background: none; color: var(--muted); padding: 8px 12px; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas button[aria-selected="true"] { color: var(--text); border-color: var(--accent); font-weight: 600; }
  .filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .filtros label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  input, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
  .chips button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grupo { margin-bottom: 20px; }
  .grupo h2 { font-size: 16px; margin: 0 0 2px; }
  .grupo .muted { margin-bottom: 8px; }
  .lista { display: flex; flex-direction: column; gap: 8px; }
  .oferta { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-decoration: none; color: inherit; }
  .oferta:hover { border-color: var(--accent); }
  .oferta img, .oferta .sem-capa { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex: none; background: var(--line); }
  .oferta .info { flex: 1; min-width: 0; }
  .oferta .titulo { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .oferta .preco { font-weight: 700; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .selos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .selo { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .selo.bom { background: var(--good-soft); color: var(--good); font-weight: 600; }
  .vazio { color: var(--muted); padding: 24px 0; text-align: center; }
  details { margin-top: 24px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--warn); }
  details li { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Caça Vinil</h1>
    <span class="muted" id="atualizado">Carregando…</span>
  </header>

  <div class="abas" role="tablist">
    <button role="tab" data-aba="desejos" aria-selected="true">Lista de desejos</button>
    <button role="tab" data-aba="varredura" aria-selected="false">Varredura geral</button>
  </div>

  <div class="filtros">
    <label>Buscar <input id="busca" type="search" placeholder="artista, título…"></label>
    <label>Teto, preço total (R$) <input id="teto" type="number" min="0" step="10" placeholder="da configuração"></label>
    <label>Fonte <select id="fonte"><option value="">Todas</option></select></label>
    <label>Estado <select id="condicao"><option value="">Qualquer</option><option value="novo">Novo</option><option value="usado">Usado</option></select></label>
  </div>

  <div class="chips" id="criterios">
    <button data-criterio="teto" aria-pressed="true">Todas dentro do teto</button>
    <button data-criterio="discogs" aria-pressed="false">Abaixo do Discogs</button>
    <button data-criterio="maisBarato" aria-pressed="false">Mais barato entre lojas</button>
  </div>

  <div id="conteudo"></div>
  <details id="avisos" hidden><summary></summary><ul></ul></details>
</main>

<script>
const estado = { aba: "desejos", criterio: "teto", dados: null };
try { const s = JSON.parse(localStorage.getItem("cacaVinil") || "{}"); Object.assign(estado, { aba: s.aba || estado.aba, criterio: s.criterio || estado.criterio }); } catch {}

const $ = (s) => document.querySelector(s);
const reais = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const seguro = (u) => (/^https?:\/\//i.test(u || "") ? u : null);

function el(tag, props = {}, ...filhos) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  for (const f of filhos) if (f != null) e.append(f);
  return e;
}

// Preço com frete e impostos de importação; arquivos antigos não têm o campo.
const total = (o) => o.precoTotal ?? o.preco;

// Só aparece o que cabe no teto pelo preço total. O teto é recalculado aqui
// para o campo "Teto" valer na hora.
function dentroDoTeto(o) {
  const t = Number($("#teto").value);
  return total(o) <= ($("#teto").value && t > 0 ? t : o.teto);
}

function atende(o, criterio) {
  return dentroDoTeto(o) && (criterio === "teto" || o.criterios[criterio] === true);
}

function visiveis() {
  const termo = norm($("#busca").value.trim());
  const fonte = $("#fonte").value;
  const condicao = $("#condicao").value;
  return estado.dados.ofertas.filter((o) =>
    (estado.aba === "desejos" ? o.desejo : !o.desejo) &&
    (!fonte || o.fonte === fonte) &&
    (!condicao || o.condicao === condicao) &&
    (!termo || norm(o.titulo + " " + o.busca).includes(termo)) &&
    atende(o, estado.criterio));
}

function cartao(o) {
  const selos = [el("span", { className: "selo", textContent: o.fonte })];
  if (o.condicao) selos.push(el("span", { className: "selo", textContent: o.condicao }));
  if (o.freteGratis) selos.push(el("span", { className: "selo", textContent: "frete grátis" }));
  if (o.custos) selos.push(el("span", { className: "selo", textContent: "importado" }));
  if (o.criterios.discogs) selos.push(el("span", { className: "selo bom", textContent: "abaixo do Discogs" }));
  if (o.criterios.maisBarato) selos.push(el("span", { className: "selo bom", textContent: "mais barato" }));
  const capa = seguro(o.imagem)
    ? el("img", { src: o.imagem, alt: "", loading: "lazy", referrerPolicy: "no-referrer" })
    : el("div", { className: "sem-capa" });
  const c = o.custos;
  const detalhe = c
    ? el("div", { className: "muted", textContent: `disco ${reais(o.preco)} + frete ${reais(c.frete)} + impostos ${reais(c.impostoImportacao + c.icms + c.despacho)}` })
    : null;
  return el("a", { className: "oferta", href: seguro(o.url) || "#", target: "_blank", rel: "noopener noreferrer", title: o.observacao || "" },
    capa,
    el("div", { className: "info" },
      el("div", { className: "titulo", textContent: o.titulo }),
      o.observacao ? el("div", { className: "muted", textContent: o.observacao }) : null,
      el("div", { className: "selos" }, ...selos)),
    el("div", { style: "text-align:right" }, el("div", { className: "preco", textContent: reais(total(o)) }), detalhe));
}

function render() {
  const d = estado.dados;
  document.querySelectorAll(".abas button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.aba === estado.aba)));
  document.querySelectorAll("#criterios button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.criterio === estado.criterio)));
  // "Mais barato" só faz sentido comparando o mesmo disco entre lojas.
  $('#criterios [data-criterio="maisBarato"]').hidden = estado.aba !== "desejos";
  $('#criterios [data-criterio="discogs"]').hidden = estado.aba !== "desejos";
  if (estado.aba !== "desejos" && ["maisBarato", "discogs"].includes(estado.criterio)) estado.criterio = "teto";
  $("#teto").placeholder = estado.aba === "desejos" ? `${d.teto} (padrão)` : `${d.tetoVarredura} (padrão)`;

  const ofertas = visiveis();
  const alvo = $("#conteudo");
  alvo.replaceChildren();

  if (estado.aba === "desejos") {
    if (d.desejos.length === 0) return alvo.append(el("p", { className: "vazio", textContent: "A lista de desejos está vazia. Adicione discos em vinil/config.json." }));
    let algum = false;
    for (const desejo of d.desejos) {
      const doDisco = ofertas.filter((o) => o.desejo === desejo.chave);
      const encontradas = d.ofertas.filter((o) => o.desejo === desejo.chave).length;
      if (doDisco.length > 0) algum = true;
      const info = [`teto ${reais(desejo.teto)}`];
      if (desejo.refDiscogs) info.push(`referência Discogs (VG+) ${reais(desejo.refDiscogs)}`);
      info.push(`${encontradas} oferta(s) encontrada(s), ${doDisco.length} dentro do teto`);
      alvo.append(el("section", { className: "grupo" },
        el("h2", { textContent: `${desejo.artista} – ${desejo.titulo}` }),
        el("div", { className: "muted", textContent: info.join(" · ") }),
        doDisco.length ? el("div", { className: "lista" }, ...doDisco.map(cartao)) : el("p", { className: "muted", textContent: "Nenhuma oferta dentro do teto agora." })));
    }
    if (!algum) alvo.prepend(el("p", { className: "vazio", textContent: "Nenhum disco da lista tem oferta dentro do teto que atenda a esse critério agora." }));
  } else {
    alvo.append(ofertas.length
      ? el("div", { className: "lista" }, ...ofertas.map(cartao))
      : el("p", { className: "vazio", textContent: "Nenhuma oferta com esses filtros." }));
  }
}

function salvar() {
  try { localStorage.setItem("cacaVinil", JSON.stringify({ aba: estado.aba, criterio: estado.criterio })); } catch {}
}

document.querySelectorAll(".abas button").forEach((b) => b.addEventListener("click", () => { estado.aba = b.dataset.aba; salvar(); render(); }));
document.querySelectorAll("#criterios button").forEach((b) => b.addEventListener("click", () => { estado.criterio = b.dataset.criterio; salvar(); render(); }));
for (const id of ["#busca", "#teto", "#fonte", "#condicao"]) $(id).addEventListener("input", () => render());

fetch("ofertas.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then((d) => {
    estado.dados = d;
    $("#atualizado").textContent = d.geradoEm
      ? `Atualizado em ${new Date(d.geradoEm).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}`
      : "Ainda não houve nenhuma varredura";
    for (const f of [...new Set(d.ofertas.map((o) => o.fonte))].sort()) $("#fonte").append(el("option", { value: f, textContent: f }));
    if (d.erros.length) {
      $("#avisos summary").textContent = `${d.erros.length} aviso(s) da última varredura`;
      $("#avisos ul").append(...d.erros.map((e) => el("li", { textContent: e })));
      $("#avisos").hidden = false;
    }
    render();
  })
  .catch((e) => { $("#conteudo").replaceChildren(el("p", { className: "vazio", textContent: `Não consegui carregar as ofertas (${e.message}).` })); $("#atualizado").textContent = ""; });
</script>
</body>
</html>
