name: Varredura de vinil

on:
  schedule:
    # A cada 6 horas (horário UTC); minuto quebrado para fugir do pico das :00.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinil
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node vinil/src/varrer.ts
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Salva as ofertas (lidas pela página) e quais já foram alertadas.
      - name: Salvar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vinil/site/ofertas.json vinil/estado/vistos.json
          git diff --cached --quiet && exit 0
          git commit -m "Varredura de vinil: atualiza ofertas"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
